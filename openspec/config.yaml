schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Next.js (App Router) + i18n across 7 locales (en, ru, zh, ar, vi, he, fr).
  Companion API service: binayah-api (Fastify + MongoDB), separate repo.
  MongoDB via Mongoose, but several collections are written by external
  processes (a CRM sync, an article generator) that bypass Mongoose, so
  field TYPES are not uniform — dates are sometimes BSON Date, sometimes
  ISO strings; some numeric fields are mislabeled units (a `size` field
  has held sqm while `sizeUnit` said "sqft"). Never assume a field's
  shape from the TS interface alone — read real documents from the DB
  first for any change that touches listings, projects, or DLD data.
  Several "empty-looking" fields (community, buildingName) are actually
  recoverable from other fields (e.g. seo.metaTitle) rather than truly
  missing — check before treating blank as unavailable.
  ISR: ~3,000 project pages x multiple sub-routes x 7 locales — a page's
  `revalidate` interval has real hosting-cost impact at this scale.
  Prefer verifying a fix against the live DB or a real API response over
  trusting types or a green build alone.

