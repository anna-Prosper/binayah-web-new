name: Deploy to Beget

on:
  push:
    branches:
      - main

# Only one deploy at a time — cancels queued run if a newer push arrives
concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 155.212.186.193
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -e

            # Create 2GB swap if not already present (prevents OOM during build)
            if [ ! -f /swapfile ]; then
              fallocate -l 2G /swapfile
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile none swap sw 0 0' >> /etc/fstab
            fi

            cd /var/www/binayah-ru

            printf 'NEXT_PUBLIC_SITE_URL=https://binayah.ru\n' > .env.local
            printf 'NEXT_PUBLIC_RU_SITE_URL=https://binayah.ru\n' >> .env.local
            printf 'NEXT_PUBLIC_API_URL=https://binayah-api.onrender.com\n' >> .env.local
            printf 'API_BASE_URL=https://binayah-api.onrender.com\n' >> .env.local
            printf 'NEXT_PUBLIC_WHATSAPP_NUMBER=971549988811\n' >> .env.local
            printf 'NEXTAUTH_URL=https://binayah.ru\n' >> .env.local

            git pull
            npm install

            # Stop server during build to free RAM (build needs ~1.5GB alone)
            pm2 stop binayah-ru || true
            NODE_OPTIONS="--max-old-space-size=1536" npm run build

            # Start / reload after successful build
            pm2 reload binayah-ru 2>/dev/null || pm2 start npm --name binayah-ru -- start
