name: Deploy to Beget

on:
  push:
    branches:
      - main

# Only one deploy at a time
concurrency:
  group: deploy-beget
  cancel-in-progress: false

# The Beget VPS (8.7G disk / 960MB RAM) physically cannot build this app in
# place: `npm ci` (node_modules + npm cache, ~1.2G at once) overflows the disk
# and the disk-full state crashes both the runner and the serving app (502).
# So we build on a GitHub-hosted runner (plenty of disk/RAM) and ship only the
# built artifact to the box, which just runs `next start` — no build footprint.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Build-time env. NEXT_PUBLIC_* are inlined into the bundle here; server
      # secrets are written too (harmless at build) but are NOT shipped in the
      # artifact (excluded below) — the box writes its own copy from secrets.
      - name: Write env
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_PATH_TOKEN: ${{ secrets.ADMIN_PATH_TOKEN }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
          BRIGHTDATA_PROXY_URL: ${{ secrets.BRIGHTDATA_PROXY_URL }}
          BRIGHTDATA_USERNAME: ${{ secrets.BRIGHTDATA_USERNAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_VERIFICATION_CODE: ${{ secrets.GOOGLE_VERIFICATION_CODE }}
          HMAC_KEY: ${{ secrets.HMAC_KEY }}
          INQUIRY_EMAIL: ${{ secrets.INQUIRY_EMAIL }}
          LEADS_API_BASE_URL: ${{ secrets.LEADS_API_BASE_URL }}
          LEADS_API_KEYS: ${{ secrets.LEADS_API_KEYS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_IMPORT_SECRET: ${{ secrets.PROJECT_IMPORT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          WHATSAPP_API_BASE_URL: ${{ secrets.WHATSAPP_API_BASE_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: |
          {
            echo "NEXT_PUBLIC_SITE_URL=https://binayah.ru"
            echo "NEXT_PUBLIC_RU_SITE_URL=https://binayah.ru"
            echo "NEXT_PUBLIC_API_URL=https://binayah-api.onrender.com"
            echo "API_BASE_URL=https://binayah-api.onrender.com"
            echo "NEXT_PUBLIC_WHATSAPP_NUMBER=971549988811"
            echo "NEXTAUTH_URL=https://binayah.ru"
            echo "NEXT_DEFAULT_LOCALE=ru"
            for k in ADMIN_EMAILS ADMIN_PATH_TOKEN ADMIN_SECRET \
                     AWS_ACCESS_KEY_ID AWS_REGION AWS_S3_BUCKET AWS_SECRET_ACCESS_KEY \
                     BRIGHTDATA_API_KEY BRIGHTDATA_PASSWORD BRIGHTDATA_PROXY_URL BRIGHTDATA_USERNAME \
                     ENCRYPTION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_VERIFICATION_CODE \
                     HMAC_KEY INQUIRY_EMAIL LEADS_API_BASE_URL LEADS_API_KEYS MONGODB_URI \
                     NEXTAUTH_SECRET OPENAI_API_KEY PROJECT_IMPORT_SECRET \
                     MAIL_FROM SMTP_HOST SMTP_PASS SMTP_PORT SMTP_SECURE SMTP_USER \
                     WHATSAPP_API_BASE_URL WHATSAPP_API_KEY WHATSAPP_GROUP_JID; do
              printf '%s=%s\n' "$k" "${!k}"
            done
          } > .env.local

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Package everything `next start` needs at runtime: the built .next (minus
      # the build-only webpack cache), public assets, configs, messages, source.
      # Exclude node_modules (the box installs prod deps), .git, and .env.local
      # (secrets are written fresh on the box — never shipped in an artifact).
      # Write the tarball OUTSIDE the working dir — tarring '.' into a file in
      # the same dir makes tar read its own growing output ("file changed as we
      # read it" → exit 1).
      - name: Package artifact
        run: |
          tar czf "$RUNNER_TEMP/deploy.tgz" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.next/cache' \
            --exclude='./.env.local' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ runner.temp }}/deploy.tgz
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: /tmp/binayah-deploy

      # Server env written on the box from repo secrets (never travels in the
      # artifact). This is what `next start` reads at runtime.
      - name: Write env on box
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          ADMIN_PATH_TOKEN: ${{ secrets.ADMIN_PATH_TOKEN }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_PASSWORD: ${{ secrets.BRIGHTDATA_PASSWORD }}
          BRIGHTDATA_PROXY_URL: ${{ secrets.BRIGHTDATA_PROXY_URL }}
          BRIGHTDATA_USERNAME: ${{ secrets.BRIGHTDATA_USERNAME }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_VERIFICATION_CODE: ${{ secrets.GOOGLE_VERIFICATION_CODE }}
          HMAC_KEY: ${{ secrets.HMAC_KEY }}
          INQUIRY_EMAIL: ${{ secrets.INQUIRY_EMAIL }}
          LEADS_API_BASE_URL: ${{ secrets.LEADS_API_BASE_URL }}
          LEADS_API_KEYS: ${{ secrets.LEADS_API_KEYS }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_IMPORT_SECRET: ${{ secrets.PROJECT_IMPORT_SECRET }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          WHATSAPP_API_BASE_URL: ${{ secrets.WHATSAPP_API_BASE_URL }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_GROUP_JID: ${{ secrets.WHATSAPP_GROUP_JID }}
        run: |
          {
            echo "NEXT_PUBLIC_SITE_URL=https://binayah.ru"
            echo "NEXT_PUBLIC_RU_SITE_URL=https://binayah.ru"
            echo "NEXT_PUBLIC_API_URL=https://binayah-api.onrender.com"
            echo "API_BASE_URL=https://binayah-api.onrender.com"
            echo "NEXT_PUBLIC_WHATSAPP_NUMBER=971549988811"
            echo "NEXTAUTH_URL=https://binayah.ru"
            echo "NEXT_DEFAULT_LOCALE=ru"
            for k in ADMIN_EMAILS ADMIN_PATH_TOKEN ADMIN_SECRET \
                     AWS_ACCESS_KEY_ID AWS_REGION AWS_S3_BUCKET AWS_SECRET_ACCESS_KEY \
                     BRIGHTDATA_API_KEY BRIGHTDATA_PASSWORD BRIGHTDATA_PROXY_URL BRIGHTDATA_USERNAME \
                     ENCRYPTION_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_VERIFICATION_CODE \
                     HMAC_KEY INQUIRY_EMAIL LEADS_API_BASE_URL LEADS_API_KEYS MONGODB_URI \
                     NEXTAUTH_SECRET OPENAI_API_KEY PROJECT_IMPORT_SECRET \
                     MAIL_FROM SMTP_HOST SMTP_PASS SMTP_PORT SMTP_SECURE SMTP_USER \
                     WHATSAPP_API_BASE_URL WHATSAPP_API_KEY WHATSAPP_GROUP_JID; do
              printf '%s=%s\n' "$k" "${!k}"
            done
          } > /tmp/binayah-deploy/.env.local

      - name: Deploy to serve dir
        run: |
          set -e
          rm -rf /tmp/binayah-stage && mkdir -p /tmp/binayah-stage
          tar xzf /tmp/binayah-deploy/deploy.tgz -C /tmp/binayah-stage
          mkdir -p /var/www/binayah-ru
          # Sync built output into the serve dir. Keep the box's own node_modules
          # and .env.local; --delete drops stale build files from removed routes.
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env.local' \
            --exclude='.next/cache' \
            /tmp/binayah-stage/ /var/www/binayah-ru/
          cp /tmp/binayah-deploy/.env.local /var/www/binayah-ru/.env.local
          cd /var/www/binayah-ru
          rm -rf .next/cache
          # Production deps only — small, fits easily; the box never builds.
          npm install --omit=dev --ignore-scripts 2>/dev/null || true
          pm2 reload binayah-ru 2>/dev/null || pm2 start npm --name binayah-ru -- start
          pm2 save

      - name: Reclaim disk
        if: always()
        run: |
          rm -rf /tmp/binayah-deploy /tmp/binayah-stage 2>/dev/null || true
          npm cache clean --force 2>/dev/null || true
          rm -rf /root/.npm/_cacache /root/.npm/_logs/* 2>/dev/null || true
          # Builds are off-box now, so the 960MB-RAM box no longer needs 3G of
          # swap. Drop the extra 1G swapfile to give the disk real headroom
          # (keep the 2G /swapfile as a runtime safety margin).
          if swapon --show | grep -q /swapfile2; then
            swapoff /swapfile2 2>/dev/null && rm -f /swapfile2 && sed -i '\#/swapfile2#d' /etc/fstab || true
          fi
          journalctl --vacuum-size=20M 2>/dev/null || true
          df -h / | tail -1 || true
