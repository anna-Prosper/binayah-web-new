name: Deploy to Beget

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 155.212.186.193
          username: root
          key: ${{ secrets.BEGET_SSH_KEY }}
          script: |
            cd /var/www/binayah-ru

            # Write env file on first deploy or whenever it changes
            cat > .env.local << 'ENVEOF'
            NEXT_PUBLIC_SITE_URL=https://binayah.ru
            NEXT_PUBLIC_RU_SITE_URL=https://binayah.ru
            NEXT_PUBLIC_API_URL=https://binayah-api.onrender.com
            API_BASE_URL=https://binayah-api.onrender.com
            NEXT_PUBLIC_WHATSAPP_NUMBER=971549988811
            NEXTAUTH_URL=https://binayah.ru
            ENVEOF

            git pull
            npm install
            NODE_OPTIONS="--max-old-space-size=1536" npm run build
            pm2 restart binayah-ru
